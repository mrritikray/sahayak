{% extends 'base.html' %}{% from 'macros.html' import csrf %}{% block content %}<section class="card auth-card centered"><span class="eyebrow">START YOUR CARE SPACE</span><h1>Create a family account</h1><p>Only profiles linked to your account will be visible to you.</p><form method="post">{{ csrf() }}<label>Your name<input name="name" required maxlength="120" autocomplete="name"></label><label>Email<input type="email" name="email" required maxlength="254" autocomplete="email"></label><label>Password<input type="password" name="password" minlength="12" maxlength="128" required autocomplete="new-password"><small>Use at least 12 characters. No password recovery is available in this local demo.</small></label><button class="btn full">Create account</button></form><a href="{{ url_for('web.login') }}">Back to sign in</a></section>{% endblock %}
